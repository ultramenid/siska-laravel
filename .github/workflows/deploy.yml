name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual "Run workflow" button

# Don't let two deploys race each other; queue instead of cancelling mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            # Non-interactive SSH may not load the login PATH — restore node/composer.
            export PATH="$HOME/.local/bin:/usr/local/bin:$HOME/.composer/vendor/bin:$PATH"
            source "$HOME/.nvm/nvm.sh" 2>/dev/null || true

            cd /home/disbun/larasiska
            git pull --ff-only
            composer install --no-dev --optimize-autoloader --no-interaction
            npm ci
            npm run build

            docker compose exec -T app php artisan migrate --force
            docker compose exec -T app php artisan optimize:clear
            docker compose restart app