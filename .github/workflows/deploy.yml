name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # manual "Run workflow" button

# Don't let two deploys race each other; queue instead of cancelling mid-deploy.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # All build steps run INSIDE containers on the server, so the host
          # only needs git + docker (no PHP, no Node installed locally).
          script: |
            set -e
            cd /home/disbun/larasiska
            git pull --ff-only

            # Rebuild the PHP-FPM image (reuses cache; only changes when Dockerfile changes)
            docker compose build app

            # composer install inside the app container (host has no PHP)
            docker compose run --rm --no-deps app composer install --no-dev --optimize-autoloader --no-interaction

            # Frontend build in a throwaway node container (host has no Node).
            # Writes public/build onto the bind-mounted host dir so nginx can serve it.
            docker run --rm -v "$PWD:/app" -w /app node:20-alpine sh -c "npm ci && npm run build"

            # Start/refresh the app container, then migrate + clear caches.
            docker compose up -d app
            # Run artisan as www-data (uid 33 on Debian fpm) so cache/log files
            # in storage/ are owned by the same user the FPM worker runs as —
            # otherwise root-owned files make the next request hit tempnam() fallbacks.
            docker compose exec -T --user www-data app php artisan migrate --force
            docker compose exec -T --user www-data app php artisan optimize:clear
            docker compose restart app