<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — SISKA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-dark': '#132822',
            'brand-teal': '#009180',
          }
        }
      }
    }
  </script>
  <style>
    input:focus {
      outline: none;
      border-color: #009180;
      box-shadow: 0 0 0 3px rgba(0, 145, 128, 0.2);
    }
  </style>
</head>
<body class="min-h-screen flex">

  <!-- Left panel: hidden on mobile -->
  <div class="hidden sm:flex sm:w-1/2 relative overflow-hidden">
    <!-- Background image -->
    <img
      src="assets/sawitfull.png"
      alt="Sawit background"
      class="absolute inset-0 w-full h-full object-cover"
    />
    <!-- Gradient overlay -->
    <div
      class="absolute inset-0"
      style="background: linear-gradient(to top, rgba(19,40,34,0.95) 0%, rgba(19,40,34,0.4) 60%, transparent 100%);"
    ></div>
    <!-- Bottom-left branding -->
    <div class="relative z-10 flex flex-col justify-end p-10 pb-12">
      <img
        src="assets/web-logo-ok-disbun.png"
        alt="Logo Disbun"
        class="h-12 w-auto mb-4 object-contain object-left"
      />
      <h1 class="text-white text-4xl font-bold tracking-wide mb-2">SISKA</h1>
      <p class="text-white/80 text-sm leading-relaxed max-w-xs">
        Sistem Informasi Komoditas Perkebunan Kalimantan Tengah
      </p>
    </div>
  </div>

  <!-- Right panel -->
  <div class="w-full sm:w-1/2 flex items-center justify-center min-h-screen px-6 py-12" style="background-color: #f9fafb;">
    <div class="w-full max-w-sm">

      <!-- Mobile-only logo + tagline -->
      <div class="flex flex-col items-center mb-8 sm:hidden">
        <img
          src="assets/web-logo-ok-disbun.png"
          alt="Logo Disbun"
          class="h-12 w-auto mb-3 object-contain"
        />
        <p class="text-center text-sm text-gray-500 leading-relaxed">
          Sistem Informasi Komoditas Perkebunan Kalimantan Tengah
        </p>
      </div>

      <!-- Form heading -->
      <h2 class="text-2xl font-bold text-gray-900 mb-1">Masuk</h2>
      <p class="text-sm text-gray-500 mb-8">Masukkan kredensial Anda untuk melanjutkan</p>

      <!-- Login form -->
      <form onsubmit="handleLogin(event)" novalidate>

        <!-- Username -->
        <div class="mb-5">
          <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">
            Username
          </label>
          <input
            id="username"
            type="text"
            placeholder="Masukkan username"
            required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 placeholder-gray-400 transition-colors"
          />
        </div>

        <!-- Password -->
        <div class="mb-6">
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">
            Password
          </label>
          <input
            id="password"
            type="password"
            placeholder="Masukkan password"
            required
            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-sm text-gray-900 placeholder-gray-400 transition-colors"
          />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="w-full py-2.5 rounded-lg text-white text-sm font-semibold transition-opacity hover:opacity-90 active:opacity-80"
          style="background-color: #132822;"
        >
          Masuk
        </button>

      </form>

      <!-- Back to home -->
      <div class="mt-6 text-center">
        <a
          href="index.html"
          class="text-sm font-medium hover:underline"
          style="color: #009180;"
        >
          Kembali ke beranda
        </a>
      </div>

    </div>
  </div>

  <script>
    function handleLogin(event) {
      event.preventDefault();
      alert('Login berhasil! Redirecting...');
      setTimeout(function () {
        window.location.href = 'data.html';
      }, 1000);
    }
  </script>

</body>
</html>
