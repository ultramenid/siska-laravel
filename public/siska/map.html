<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peta - SISKA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3.10.3/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.5.1/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.5.1/dist/leaflet.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .map-overlay-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
      padding: 12px 16px;
    }
    #layer-panel-body {
      display: block;
    }
    #layer-panel-body.hidden {
      display: none;
    }
  </style>
</head>
<body class="flex flex-col" style="height:100dvh;">

  <!-- Header / Nav -->
  <header class="w-full relative z-50" style="background-color:#132822;">
    <div class="max-w-7xl mx-auto px-6">
      <div class="flex items-center justify-between h-16">
        <a href="index.html"><img src="../assets/v1/web-logo-ok-disbun.png" alt="SISKA" class="h-10"></a>
        <nav class="hidden sm:flex items-center space-x-8">
          <a href="index.html" class="text-white text-sm font-medium hover:opacity-80">Home</a>
          <a href="tentang.html" class="text-white text-sm font-medium hover:opacity-80">Tentang</a>
          <a href="map.html" class="text-white text-sm font-medium hover:opacity-80">Peta</a>
          <a href="data.html" class="text-white text-sm font-medium hover:opacity-80">Data</a>
          <a href="login.html" class="text-white text-sm font-medium hover:opacity-80">Login</a>
        </nav>
        <div class="sm:hidden" x-data="{ open: false }">
          <button @click="open = !open" class="text-white focus:outline-none">
            <svg x-show="!open" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
            <svg x-show="open" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
          <div x-show="open" @click.outside="open = false" class="absolute top-16 left-0 right-0 shadow-lg z-50 px-6 py-4 space-y-3" style="background-color:#132822;display:none;">
            <a href="index.html" class="block text-white text-sm font-medium py-2 border-b border-white border-opacity-10">Home</a>
            <a href="tentang.html" class="block text-white text-sm font-medium py-2 border-b border-white border-opacity-10">Tentang</a>
            <a href="map.html" class="block text-white text-sm font-medium py-2 border-b border-white border-opacity-10">Peta</a>
            <a href="data.html" class="block text-white text-sm font-medium py-2 border-b border-white border-opacity-10">Data</a>
            <a href="login.html" class="block text-white text-sm font-medium py-2">Login</a>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Map Section -->
  <section class="flex flex-col flex-1 relative" style="height: calc(100dvh - 64px);">
    <div class="relative flex-1">
      <div id="map"></div>

      <!-- Title Overlay (top-left) -->
      <div class="map-overlay-card absolute top-4 left-4" style="z-index:1000; min-width:160px;">
        <div class="flex items-center gap-2 mb-1">
          <div class="w-3 h-3 rounded-full" style="background-color:#009180;"></div>
          <span class="text-xs font-bold uppercase tracking-wide" style="color:#132822;">Peta Perkebunan</span>
        </div>
        <p class="text-xs text-gray-500 leading-tight">Kalimantan Tengah</p>
      </div>

      <!-- Layer Panel (top-right) -->
      <div class="map-overlay-card absolute top-4 right-4" style="z-index:1000; min-width:200px;">
        <div class="flex items-center justify-between gap-4">
          <span class="text-xs font-bold uppercase tracking-wide" style="color:#132822;">Layer</span>
          <button
            onclick="toggleLayerPanel()"
            class="text-xs px-2 py-1 rounded font-medium focus:outline-none"
            style="background-color:#009180; color:white;"
            id="layer-toggle-btn"
          >Sembunyikan</button>
        </div>
        <div id="layer-panel-body" class="mt-3 space-y-2">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk-pabrik" checked onchange="handleLayer('pabrik', this.checked)"
              class="w-4 h-4 rounded accent-teal-600">
            <span class="text-xs text-gray-700">Pabrik Kelapa Sawit</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk-kawasan" checked onchange="handleLayer('kawasan', this.checked)"
              class="w-4 h-4 rounded accent-teal-600">
            <span class="text-xs text-gray-700">Kawasan Hutan</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk-izin" checked onchange="handleLayer('izin', this.checked)"
              class="w-4 h-4 rounded accent-teal-600">
            <span class="text-xs text-gray-700">Izin Perkebunan</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk-tutupan" checked onchange="handleLayer('tutupan', this.checked)"
              class="w-4 h-4 rounded accent-teal-600">
            <span class="text-xs text-gray-700">Tutupan Sawit</span>
          </label>
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="chk-batas" checked onchange="handleLayer('batas', this.checked)"
              class="w-4 h-4 rounded accent-teal-600">
            <span class="text-xs text-gray-700">Batas Administrasi</span>
          </label>
        </div>
      </div>
    </div>
  </section>

  <script>
    // --- Layer panel toggle ---
    function toggleLayerPanel() {
      var body = document.getElementById('layer-panel-body');
      var btn = document.getElementById('layer-toggle-btn');
      if (body.classList.contains('hidden')) {
        body.classList.remove('hidden');
        btn.textContent = 'Sembunyikan';
      } else {
        body.classList.add('hidden');
        btn.textContent = 'Tampilkan';
      }
    }

    // --- Leaflet map ---
    var map = L.map('map', {
      center: [-1.2193, 113.6213],
      zoom: 8,
      zoomControl: false
    });

    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // Base layer
    L.tileLayer(
      'http://services.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: 'Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
        maxZoom: 19
      }
    ).addTo(map);

    // WMS config
    var wmsUrl = 'https://aws.simontini.id/geoserver/wms';
    var wmsOptions = {
      format: 'image/png',
      transparent: true,
      version: '1.1.1'
    };

    var wmsLayers = {
      pabrik:   L.tileLayer.wms(wmsUrl, Object.assign({}, wmsOptions, { layers: 'siska:Pabrik_Kelapa_Sawit_New' })),
      kawasan:  L.tileLayer.wms(wmsUrl, Object.assign({}, wmsOptions, { layers: 'siska:Penunjukan_Kawasan_Hutan_Update2021_Trial' })),
      izin:     L.tileLayer.wms(wmsUrl, Object.assign({}, wmsOptions, { layers: 'siska:Update_Ijin_Kalteng 2021' })),
      tutupan:  L.tileLayer.wms(wmsUrl, Object.assign({}, wmsOptions, { layers: 'siska:kalteng_tutupan_sawit_20190918' })),
      batas:    L.tileLayer.wms(wmsUrl, Object.assign({}, wmsOptions, { layers: 'siska:kalteng_adm_line' }))
    };

    // Add all layers by default
    Object.values(wmsLayers).forEach(function(layer) {
      layer.addTo(map);
    });

    // Checkbox handler
    function handleLayer(name, checked) {
      if (checked) {
        wmsLayers[name].addTo(map);
      } else {
        map.removeLayer(wmsLayers[name]);
      }
    }

    // Resize handler
    window.addEventListener('resize', function() {
      map.invalidateSize();
    });
  </script>
</body>
</html>
